<script>
  (function() {
    // Holographic Laser Scanner Vertical Animation
    const scanLine = document.getElementById('laser-scan-line');
    let direction = 1;
    let pos = 5;
    
    function animateScan() {
      if (!scanLine) return;
      pos += 0.85 * direction;
      if (pos >= 92) {
        direction = -1;
      } else if (pos <= 4) {
        direction = 1;
      }
      scanLine.style.top = pos + '%';
      requestAnimationFrame(animateScan);
    }
    requestAnimationFrame(animateScan);

    // Auto / Manual Capture Mode Toggle Logic
    const autoBtn = document.getElementById('mode-auto');
    const manualBtn = document.getElementById('mode-manual');

    if (autoBtn && manualBtn) {
      autoBtn.addEventListener('click', () => {
        autoBtn.className = 'px-3.5 py-1 rounded-full font-label-sm text-label-sm transition-all duration-200 bg-primary-container text-on-primary-container font-semibold shadow-sm';
        manualBtn.className = 'px-3.5 py-1 rounded-full font-label-sm text-label-sm transition-all duration-200 text-on-surface-variant hover:text-on-surface';
      });

      manualBtn.addEventListener('click', () => {
        manualBtn.className = 'px-3.5 py-1 rounded-full font-label-sm text-label-sm transition-all duration-200 bg-primary-container text-on-primary-container font-semibold shadow-sm';
        autoBtn.className = 'px-3.5 py-1 rounded-full font-label-sm text-label-sm transition-all duration-200 text-on-surface-variant hover:text-on-surface';
      });
    }

    // Shutter Trigger Haptic Micro-Interaction
    const shutter = document.getElementById('shutter-trigger');
    const shutterCore = document.getElementById('shutter-core');
    if (shutter && shutterCore) {
      shutter.addEventListener('pointerdown', () => {
        shutterCore.classList.add('scale-90');
      });
      shutter.addEventListener('pointerup', () => {
        shutterCore.classList.remove('scale-90');
      });
      shutter.addEventListener('pointerleave', () => {
        shutterCore.classList.remove('scale-90');
      });
    }

    // Flashlight Toggle States
    const flashBtn = document.getElementById('flash-btn');
    const flashIcons = ['flash_auto', 'flash_on', 'flash_off'];
    let flashIdx = 0;
    if (flashBtn) {
      flashBtn.addEventListener('click', () => {
        flashIdx = (flashIdx + 1) % flashIcons.length;
        const iconElem = flashBtn.querySelector('.material-symbols-outlined');
        if (iconElem) {
          iconElem.textContent = flashIcons[flashIdx];
          if (flashIcons[flashIdx] === 'flash_on') {
            iconElem.className = 'material-symbols-outlined text-[20px] text-primary';
          } else if (flashIcons[flashIdx] === 'flash_off') {
            iconElem.className = 'material-symbols-outlined text-[20px] text-outline';
          } else {
            iconElem.className = 'material-symbols-outlined text-[20px] text-tertiary';
          }
        }
      });
    }
  })();
