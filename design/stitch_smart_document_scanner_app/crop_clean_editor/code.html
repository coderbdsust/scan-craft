<span class="font-label-md text-xs text-slate-600 font-bold">60%</span>
</div>
<div class="relative w-full h-6 flex items-center cursor-pointer">
<div class="w-full h-2 rounded-full bg-slate-100 border border-slate-200">
<div class="h-full bg-[#006a63] rounded-full" style="width: 60%;"></div>
</div>
<div class="absolute left-[60%] -translate-x-1/2 w-4 h-4 rounded-full bg-white shadow-md ring-4 ring-[#006a63]/30 border border-[#006a63]"></div>
</div>
</div>
</div>
</div>
</div>
<script>
  (function() {
    // Quick Deskew switch micro-interaction
    const deskewBtn = document.getElementById('toggle-deskew');
    if (deskewBtn) {
      deskewBtn.addEventListener('click', function() {
        const thumb = this.querySelector('div');
        const isActive = thumb.classList.contains('translate-x-5');
        if (isActive) {
          thumb.classList.remove('translate-x-5');
          thumb.classList.add('translate-x-0');
          this.classList.remove('bg-[#0a8f64]');
          this.classList.add('bg-slate-300');
        } else {
          thumb.classList.remove('translate-x-0');
          thumb.classList.add('translate-x-5');
          this.classList.add('bg-[#0a8f64]');
          this.classList.remove('bg-slate-300');
        }
      });
    }

    // Reset button micro-feedback
    const resetBtn = document.getElementById('reset-btn');
    if (resetBtn) {
      resetBtn.addEventListener('click', function() {
        this.classList.add('scale-95');
        setTimeout(() => this.classList.remove('scale-95'), 150);
      });
    }
  })();
</script></main></body></html>
