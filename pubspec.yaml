name: scancraft
description: "Document Scanner Project"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^2.0.0

  # Camera capture & photo import for real document scanning
  camera: ^0.12.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4

  # Pure-Dart pixel processing: crop/perspective, filters, deskew
  image: ^4.2.1
  pdf: ^3.13.1
  share_plus: ^13.3.1
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.2

dependency_overrides:
  # Upstream local_auth_android 2.3.0 uses FlutterLifecycleAdapter, which was
  # removed from the Flutter 3.47 engine. Vendored copy is patched to use
  # HiddenLifecycleReference (see vendor/local_auth_android/CHANGELOG note).
  local_auth_android:
    path: vendor/local_auth_android

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Fonts
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
    - family: Space Grotesk
      fonts:
        - asset: fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: fonts/SpaceGrotesk-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"